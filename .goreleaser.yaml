version: 2

project_name: flynn

before:
  hooks:
    - go mod tidy

builds:
  - id: flynn
    main: ./cmd/flynn
    binary: flynn
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/ionalpha/flynn/internal/version.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

# Native Linux packages built from the same binaries and attached to the release, so a
# Debian, RPM, or Alpine host can install with its own package manager. These are
# generated by goreleaser with no external tooling; hosting an apt/yum repository is a
# separate step and not required to install a downloaded package.
nfpms:
  - id: flynn
    package_name: flynn
    vendor: Ion Alpha
    homepage: https://github.com/ionalpha/flynn
    maintainer: Ion Alpha <contact@ionalpha.io>
    description: A secure agent operating system in a single Go binary.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk

# Package-manager channels. Each one pushes to a repository outside this one, which the
# workflow's GITHUB_TOKEN cannot write, so they use PACKAGES_TOKEN. Without that secret
# (a fork, a local snapshot) they render but do not upload, so a missing token cannot
# fail a release halfway through publishing. `auto` also skips pre-releases: a package
# manager has no candidate channel, and an rc there would reach every user on update.
# `flynn upgrade` refuses to replace a binary installed by any of these managers
# (internal/selfupdate), so the manager stays the only thing that updates it.
homebrew_casks:
  - name: flynn
    repository:
      owner: ionalpha
      name: homebrew-tap
      token: '{{ index .Env "PACKAGES_TOKEN" }}'
    directory: Casks
    homepage: https://github.com/ionalpha/flynn
    description: A secure agent operating system in a single Go binary.
    license: Apache-2.0
    binaries: [flynn]
    skip_upload: '{{ if index .Env "PACKAGES_TOKEN" }}auto{{ else }}true{{ end }}'
    # The binary is not notarized, so macOS would quarantine it and Gatekeeper would
    # block the first run. Its integrity is the signed checksum and provenance this
    # release publishes, which Homebrew's own sha256 check is pinned to.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/flynn"]
          end

scoops:
  - name: flynn
    repository:
      owner: ionalpha
      name: scoop-bucket
      token: '{{ index .Env "PACKAGES_TOKEN" }}'
    directory: bucket
    homepage: https://github.com/ionalpha/flynn
    description: A secure agent operating system in a single Go binary.
    license: Apache-2.0
    skip_upload: '{{ if index .Env "PACKAGES_TOKEN" }}auto{{ else }}true{{ end }}'

# WinGet takes a pull request to microsoft/winget-pkgs from a fork, which Microsoft's
# validation and a moderator review before `winget install IonAlpha.Flynn` sees it.
winget:
  - name: flynn
    package_identifier: IonAlpha.Flynn
    publisher: Ion Alpha
    short_description: A secure agent operating system in a single Go binary.
    homepage: https://github.com/ionalpha/flynn
    license: Apache-2.0
    license_url: https://github.com/ionalpha/flynn/blob/main/LICENSE
    release_notes_url: "https://github.com/ionalpha/flynn/releases/tag/{{ .Tag }}"
    tags: [agent, ai, cli, sandbox]
    skip_upload: '{{ if index .Env "PACKAGES_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      owner: ionalpha
      name: winget-pkgs
      branch: "IonAlpha.Flynn-{{ .Version }}"
      token: '{{ index .Env "PACKAGES_TOKEN" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# Multi-architecture container images built from the same signed binary and pushed to
# both GHCR and Docker Hub. Each architecture is built and pushed as its own suffixed
# tag; the docker_manifests below fuse them into a single multi-arch tag that resolves
# to the right image per host. Dockerfile.release copies the prebuilt binary rather than
# recompiling, so the image and the release archives are the same bytes.
dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/ionalpha/flynn:{{ .Version }}-amd64"
      - "docker.io/ionalpha/flynn:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=flynn"
      - "--label=org.opencontainers.image.description=A secure agent operating system in a single Go binary."
      - "--label=org.opencontainers.image.url=https://github.com/ionalpha/flynn"
      - "--label=org.opencontainers.image.source=https://github.com/ionalpha/flynn"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    use: buildx
    image_templates:
      - "ghcr.io/ionalpha/flynn:{{ .Version }}-arm64"
      - "docker.io/ionalpha/flynn:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=flynn"
      - "--label=org.opencontainers.image.description=A secure agent operating system in a single Go binary."
      - "--label=org.opencontainers.image.url=https://github.com/ionalpha/flynn"
      - "--label=org.opencontainers.image.source=https://github.com/ionalpha/flynn"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/ionalpha/flynn:{{ .Version }}"
    image_templates:
      - "ghcr.io/ionalpha/flynn:{{ .Version }}-amd64"
      - "ghcr.io/ionalpha/flynn:{{ .Version }}-arm64"
  # `latest` follows released versions only. GitHub already marks a v0.1.3-rc.1 as a
  # pre-release, but the container tag has no such notion, so without this a candidate
  # moved `latest` and `docker pull ionalpha/flynn` handed everyone the candidate. auto
  # skips the push when the tag is a pre-release; the version tag is still published, so
  # a candidate remains pullable by name.
  - name_template: "ghcr.io/ionalpha/flynn:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/ionalpha/flynn:{{ .Version }}-amd64"
      - "ghcr.io/ionalpha/flynn:{{ .Version }}-arm64"
  - name_template: "docker.io/ionalpha/flynn:{{ .Version }}"
    image_templates:
      - "docker.io/ionalpha/flynn:{{ .Version }}-amd64"
      - "docker.io/ionalpha/flynn:{{ .Version }}-arm64"
  - name_template: "docker.io/ionalpha/flynn:latest"
    skip_push: auto
    image_templates:
      - "docker.io/ionalpha/flynn:{{ .Version }}-amd64"
      - "docker.io/ionalpha/flynn:{{ .Version }}-arm64"

# Keyless signature over each published manifest digest, the same Sigstore/OIDC path the
# checksum signing uses, so the images are verifiable with `cosign verify`.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "--yes"
      - "${artifact}@${digest}"
    output: true

checksum:
  name_template: checksums.txt
  # The container profiles are listed in the signed checksums with the binaries, so an
  # operator can verify the files they hand to the container runtime.
  extra_files:
    - glob: deploy/seccomp/flynn.json
      name_template: flynn-seccomp.json
    - glob: deploy/apparmor/flynn-container
      name_template: flynn-apparmor-container

sboms:
  - artifacts: archive

# Keyless signing of the checksum file via cosign + Sigstore (OIDC in CI).
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

# Human-readable release notes: group the Conventional Commit subjects into
# sections and drop the noise (docs, tests, formatting, chores, CI, merges) so the
# notes summarize the user-facing changes rather than reproduce the commit log.
changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Security
      regexp: '^.*?sec(urity)?(\(.+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^Merge pull request'
      - '^Merge branch'

release:
  draft: false
  prerelease: auto
  # The profiles the container needs for the sandbox (Docker's own, each with one change;
  # see deploy/README.md), published beside the image they belong to.
  extra_files:
    - glob: deploy/seccomp/flynn.json
      name_template: flynn-seccomp.json
    - glob: deploy/apparmor/flynn-container
      name_template: flynn-apparmor-container
  # What upgrading to this tag costs somebody who already imports the module, as
  # produced by dev/apidiff in the release workflow. An importer pins, so this is
  # the one moment the question is live for them. `index` rather than .Env.NAME so
  # a local `goreleaser release --snapshot`, which sets nothing, still templates.
  footer: |
    {{ if index .Env "APIDIFF_NOTES" }}{{ .Env.APIDIFF_NOTES }}{{ end }}
