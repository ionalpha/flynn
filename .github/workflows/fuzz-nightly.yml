# The long-budget sibling of the CI fuzz smoke: same script, same targets,
# minutes of mutation per target instead of seconds. A crasher fails the run
# and is uploaded as an artifact so it can be committed as a regression seed.
name: Fuzz nightly

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (long budget)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - run: FUZZTIME=2m ./dev/fuzz
      # Collect only new inputs, not the committed seed corpus; see the
      # matching step in ci.yml.
      - name: Collect new crasher inputs
        if: failure()
        run: |
          new=$(git ls-files --others --exclude-standard | grep -E '(^|/)testdata/fuzz/' || true)
          [ -z "$new" ] && exit 0
          for f in $new; do
            mkdir -p "fuzz-crashers/$(dirname "$f")"
            cp "$f" "fuzz-crashers/$f"
          done
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers
          path: fuzz-crashers/
          if-no-files-found: ignore
