name: CI

on:
  push:
    branches: [main]
  # ready_for_review is not one of the default types, and the full suite only runs
  # once a pull request leaves draft. Without this trigger, marking a draft ready
  # fires no run, and the draft's own result would stand as the gate for a change
  # the full suite never saw. synchronize covers every push after that.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Cancel superseded runs on PR branches (a new push makes the old one moot),
# but never cancel a push to main: every landed commit must get a complete,
# recorded CI result. Cancelling a main run leaves its "CI success" gate
# reporting failure for code that was never actually broken.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Use bash on every OS (including Windows) so command parsing is identical.
# Windows runners default `run:` to PowerShell, which mangles native args like
# `-coverprofile=coverage.out` (go then sees a stray `.out` package).
defaults:
  run:
    shell: bash

jobs:
  # Which platforms this run covers, and whether the expensive jobs run at all.
  #
  # A draft pull request is work in progress: it gets the checks that catch a mistake
  # while it is still cheap to fix (build, lint, unit tests on one platform, secret
  # scan). It does not get the cross-platform matrices, the end-to-end suite, fuzz,
  # bench, or the security scanners, because a change that is still being written will
  # run them again on its next push and tell nobody anything new in between.
  #
  # Everything else runs the lot: a push to main, and any pull request that is not a
  # draft. `github.event.pull_request.draft` is empty on a push, so every guard is
  # written as `!= true` rather than `== false`, or main would quietly run the cheap
  # tier only.
  setup:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      # A JSON array, consumed by the matrices below via fromJSON.
      platforms: ${{ steps.plan.outputs.platforms }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - id: plan
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo 'platforms=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo "Draft pull request: running the fast tier on ubuntu only."
          else
            echo 'platforms=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo "Running the full suite on every platform."
          fi

  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.platforms) }}
        # Floor is Go 1.26: it makes the Green Tea GC the default and adds
        # crypto/hpke to the standard library, and satisfies modernc.org/sqlite.
        go: ["1.26"]
    steps:
      # Actions are pinned to a full commit SHA; Dependabot (.github/dependabot.yml) bumps them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          # A `1.26` spec alone resolves to whatever 1.26.x the runner already has
          # cached, so a patch release that fixes a standard-library advisory is
          # never picked up and `govulncheck` fails on a toolchain nobody chose.
          # check-latest queries for the newest matching patch on every run.
          check-latest: true
          # Caching is handled by the explicit actions/cache step below. setup-go's
          # own cache keys on the go.sum hash alone with no fallback, so any miss
          # (a dependency bump, an evicted entry, the first run on a branch)
          # recompiles every package cold - twice, once normal and once
          # race-instrumented. The step below adds restore-keys so a miss starts
          # from a near-warm build cache instead.
          cache: false
      # Windows Defender scans every file the Go toolchain writes - a test binary
      # per package plus all compile output - which is the main reason go test is
      # several times slower here than on Linux or macOS. Exclude the workspace
      # and the Go caches from real-time scanning. Windows-only, best-effort (a
      # failure just leaves the job slower, never broken), and it changes nothing
      # about what runs or the -race coverage.
      - name: Exclude Go paths from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$(go env GOCACHE)", "$(go env GOMODCACHE)", "$env:RUNNER_TEMP" -ErrorAction Stop
          } catch {
            Write-Host "Could not set Defender exclusions (continuing): $_"
          }
      # Resolve the module and build cache directories for this OS so the cache
      # step works identically on Linux, macOS, and Windows (their paths differ).
      - id: goenv
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.goenv.outputs.gomodcache }}
            ${{ steps.goenv.outputs.gobuildcache }}
          # The run-specific suffix makes every run save a fresh cache so the
          # build cache never goes stale; the restore-keys fall back to the newest
          # cache for the same go.sum, then to any cache for this OS. Because Go's
          # build cache is content-addressed, a partial restore only recompiles
          # what actually changed - never produces a wrong result.
          key: go-test-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}-
            go-test-${{ runner.os }}-${{ matrix.go }}-
      # go vet compiles every package for this OS, so a build break on this
      # platform fails here; go test then builds and runs the suite under -race.
      # A separate `go build ./...` would only be a third full compile of the tree.
      - run: go vet ./...
      - name: Test (race on every platform; coverage only where it is uploaded)
        # Only ubuntu uploads coverage, so only ubuntu pays the atomic-coverage
        # instrumentation cost. The other platforms run the identical suite under
        # -race with COVER unset, which is a correctness gate, not a coverage one.
        env:
          COVER: ${{ matrix.os == 'ubuntu-latest' && '-covermode=atomic -coverpkg=./... -coverprofile=coverage.out' || '' }}
        run: ./dev/test

      # Coverage is only a number until something fails when it drops. The floor
      # lives in dev/coverage-floor, so lowering it is a reviewed diff. Checked on
      # ubuntu alone: build tags change which files compile, so the percentage is
      # only comparable against itself on one platform.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        run: ./dev/coverfloor

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
        continue-on-error: true

      # The same profile, kept inside the repository's own trust boundary so the
      # badge job can read it without depending on a third-party service being up.
      - name: Keep the coverage profile for the badge job
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.os }})
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exercise the shipped binary on every release target.
        os: ${{ fromJSON(needs.setup.outputs.platforms) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
      - name: Exclude Go paths from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$(go env GOCACHE)", "$(go env GOMODCACHE)", "$env:RUNNER_TEMP" -ErrorAction Stop
          } catch {
            Write-Host "Could not set Defender exclusions (continuing): $_"
          }
      # The e2e suite compiles ./cmd/flynn itself and drives it as a subprocess against a
      # scripted, in-process model server, so it needs no secrets and no network. On a
      # failure it writes the run's stdout, stderr, and a copy of the data dir under
      # FLYNN_E2E_ARTIFACTS for triage.
      - name: E2E
        env:
          FLYNN_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: go test ./e2e/ -count=1
      # To surface the triage bundle in the GitHub UI, add an upload step here pinned to a
      # full commit SHA (Dependabot keeps it current), matching how every other action in
      # this workflow is pinned:
      #   - if: failure()
      #     uses: actions/upload-artifact@<sha> # v4
      #     with:
      #       name: e2e-artifacts-${{ matrix.os }}
      #       path: ${{ runner.temp }}/e2e-artifacts
      #       if-no-files-found: ignore

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          # Caching is handled by the explicit actions/cache step below, which one
          # cache covers all three lint passes (linux, windows, darwin); setup-go's
          # own cache would only key the host target.
          cache: false
      # The non-golangci half of dev/lint: go.mod and go.sum stay tidy.
      - name: go mod tidy leaves go.mod and go.sum unchanged
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # One build cache shared by every lint pass. golangci-lint typechecks the tree
      # for each GOOS it runs against, so the windows and darwin passes below compile
      # a full second and third target; without a warm cache that tripled the job.
      # Cache the module, build, and golangci analysis caches together (Go's build
      # cache is content-addressed, so it holds all three targets' objects side by
      # side and a partial restore only recompiles what changed). The run-specific
      # suffix saves a fresh cache each run so it never goes stale; the restore-keys
      # fall back to the newest cache for this go.sum, then to any lint cache.
      - id: goenv
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.goenv.outputs.gomodcache }}
            ${{ steps.goenv.outputs.gobuildcache }}
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-1.26-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-1.26-${{ hashFiles('**/go.sum') }}-
            go-lint-${{ runner.os }}-1.26-
      # Run golangci-lint from its prebuilt release binary instead of compiling it
      # from source every run. Keep the version in sync with the GOLANGCI_VERSION pin
      # in dev/lint so local and CI results match; it reads the same .golangci.yml, so
      # `golangci-lint run` here is identical to dev/lint's. Its own caching is off:
      # the actions/cache step above is the single authority, so the cross-target
      # objects the platform passes build are saved and restored with everything else.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true
      # The action above lints the host target only (GOOS=linux), so build-tagged
      # platform files (_windows.go, _darwin.go) never reach a maintainer. Re-run the
      # same linter, from the binary the action installed, cross-targeting the other
      # platforms so their files are analyzed on every PR. CGO is disabled so a
      # cgo-only dependency (a pure-Go build tag covers it) does not require a C cross
      # toolchain on the Linux runner.
      - name: Lint platform files (windows, darwin)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows golangci-lint run
          GOOS=darwin golangci-lint run

  vuln:
    name: govulncheck
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - run: ./dev/vuln

  # Secret scan: gitleaks over the full commit history, not just the tip, so a
  # secret that was committed and later removed is still caught (it lives on in
  # history, which is what an attacker reads). fetch-depth: 0 pulls every commit.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - run: ./dev/secrets

  # Dependency scan via OSV. Complements the govulncheck job: govulncheck is
  # Go/stdlib with reachability analysis (a vulnerability counts only if the
  # vulnerable symbol is reachable), osv-scanner reports the whole dependency set
  # without reachability. The two together are breadth plus reachability, not
  # redundancy.
  osv:
    name: osv-scanner
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - run: ./dev/osv

  # Custom Semgrep rules that encode project invariants (see .semgrep) as a
  # machine-checked gate. Complements golangci-lint: golangci runs fixed linters,
  # these rules assert project-specific properties that generic linters cannot,
  # such as a secret's exposed plaintext never flowing into a formatter or logger.
  semgrep:
    name: Semgrep invariants
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # pipx is preinstalled on the runner and puts semgrep on PATH; dev/semgrep
      # then uses that local binary (its Docker fallback is for machines without it).
      - name: Install semgrep
        run: pipx install semgrep==1.167.0
      - run: ./dev/semgrep

  # The performance gate: allocation-ceiling tests and the curated hot-path
  # benchmarks, run without the race detector (the test matrix runs -race, whose
  # instrumentation skews allocation counts, so the ceilings are !race-tagged
  # and only this job exercises them). The short -benchtime keeps it a smoke: it
  # proves the benchmarks run and the ceilings hold, not stable timings.
  bench:
    name: Bench smoke
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - run: BENCHTIME=100x ./dev/bench

  # Live mutation on fuzz targets, briefly. The committed seed corpus
  # already replays under the test job; this hunts for NEW crashers, and a
  # found crasher fails the PR. A PR runs only the targets its diff can
  # affect (dev/fuzz walks the import graph from FUZZ_BASE); a push to main
  # keeps the full sweep, and the nightly workflow runs the same script with
  # a longer per-target budget.
  # `go test -fuzz` takes one target per invocation, so the budget is paid per
  # target: one runner walking every target pays the sum of them. A push to main
  # takes the full sweep by design, which is ~90 targets at 5s plus each one's
  # compile and baseline-coverage cost, and that lands at over ten minutes of
  # wall clock on every merge. The targets are independent, so deal them across
  # a matrix the way the nightly already does: same fuzz-seconds, a quarter of
  # the wall clock. A pull request usually fuzzes far fewer targets (dev/fuzz
  # scopes to what the diff can break), and a shard with nothing in its slice
  # exits immediately, so the matrix costs a PR almost nothing.
  fuzz:
    name: Fuzz smoke ${{ matrix.shard }}/4
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A crasher in one slice says nothing about the others, and finding two
      # bugs in one run beats finding the first one twice.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # dev/fuzz diffs against the PR base to scope the run.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - if: github.event_name == 'pull_request'
        run: FUZZTIME=5s FUZZ_SHARD=${{ matrix.shard }}/4 FUZZ_BASE="${{ github.event.pull_request.base.sha }}" ./dev/fuzz
      - if: github.event_name != 'pull_request'
        run: FUZZTIME=5s FUZZ_SHARD=${{ matrix.shard }}/4 ./dev/fuzz
      # A crasher is written as a new file under the package's testdata/fuzz/
      # on the runner. Collect only those new files (uploading the whole tree
      # would bury them in the committed seed corpus) so the input can be
      # committed as a regression seed.
      - name: Collect new crasher inputs
        if: failure()
        run: |
          new=$(git ls-files --others --exclude-standard | grep -E '(^|/)testdata/fuzz/' || true)
          [ -z "$new" ] && exit 0
          for f in $new; do
            mkdir -p "fuzz-crashers/$(dirname "$f")"
            cp "$f" "fuzz-crashers/$f"
          done
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One artifact per shard: the upload rejects a name another job in the
          # same run already used, so a fixed name would mean the second shard to
          # find a crasher silently loses its reproducing input.
          name: fuzz-crashers-${{ matrix.shard }}
          path: fuzz-crashers/
          if-no-files-found: ignore

  # Mutation testing: flip operators and delete statements in production code,
  # then require the suite to catch each change. It is the check that a test
  # actually BITES - a test that runs the code but asserts nothing passes the
  # test job and coverage yet kills no mutant. Advisory for now: it is NOT in
  # the ci-success needs list, so a surviving mutant reports without blocking a
  # PR. Arm it by raising the thresholds in .gremlins.yaml and adding `mutate`
  # to ci-success. Every run is scoped to changed lines through dev/mutate's --diff
  # via MUTATE_BASE: a PR against its base, a push against the commit it moved from.
  #
  # continue-on-error keeps the job honest about being advisory. Without it a
  # gremlins crash, or the timeout below firing on a long full-module run, posts
  # a red check on the pull request, and the merge gate refuses to merge on any
  # failing check - so an advisory job would block exactly like an armed one.
  # Drop this line in the same change that arms the thresholds.
  mutate:
    name: Mutation (advisory)
    needs: setup
    if: needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Every mutant recompiles and reruns the affected tests, so a full-module run
    # is open-ended. Bound it: an advisory signal is not worth an hour of runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # dev/mutate diffs against the PR base to scope the run.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      # Pinned to match the GREMLINS_VERSION in dev/mutate so CI and local runs
      # use the same mutator set and behavior.
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      # Dropping the exit status is what makes "advisory" true rather than merely
      # stated. continue-on-error keeps a failed job from failing the workflow run,
      # but the job's own check still reports failure, and the merge gate refuses to
      # merge on any failing check - so without this, a gremlins crash blocks a pull
      # request over a signal nobody agreed to be blocked by. The log keeps the
      # detail. Arm the gate by taking the `|| echo` off in the same change that
      # raises the thresholds and adds `mutate` to the ci-success needs list.
      - if: github.event_name == 'pull_request'
        run: |
          MUTATE_BASE="${{ github.event.pull_request.base.sha }}" ./dev/mutate ||
            echo "::warning title=Mutation (advisory)::gremlins did not complete; see the job log"
      # A push mutates the commits it landed, not the whole module. Mutating
      # everything on every push is open-ended: each mutant recompiles and reruns
      # the affected tests, and the run outgrew the runner, which killed the job
      # mid-flight. A cancelled job reports failure no matter what the step's exit
      # status is, so an unbounded run turned the advisory check red on main for a
      # signal it never produced. The pushed range is the same scope a PR pays for.
      - if: github.event_name != 'pull_request'
        run: |
          MUTATE_BASE="${{ github.event.before }}" ./dev/mutate ||
            echo "::warning title=Mutation (advisory)::gremlins did not complete; see the job log"

  # Enforce the PR template at the gate, not just in dev/pr: this catches PRs
  # opened any other way (gh directly, the web UI, an API call). The body comes
  # from the event payload via env - never interpolated into the script - so a
  # crafted body can't inject shell. Skipped on push (no PR body to check).
  pr-body:
    name: PR body follows template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require template sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=0
          for section in "## What" "## Why" "## How to verify"; do
            case "$BODY" in
              *"$section"*) ;;
              *) echo "::error::PR body is missing the '$section' section."; missing=1 ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            echo "Base the description on .github/PULL_REQUEST_TEMPLATE.md (What / Why / How to verify / Notes)."
            exit 1
          fi
          echo "PR body contains all required template sections."

  # Publish the numbers the README's badges display: coverage, and the size of the
  # test, fuzz and benchmark surface.
  #
  # The badges read their values from an orphan `badges` branch, which holds nothing
  # but shields.io endpoint documents. Nothing else reads that branch and no history
  # is kept on it, so a force-push of a single commit is the whole publish step. The
  # alternative, a hand-written number in the README, is a claim that is accurate on
  # the day it is typed and quietly false from the next commit onward.
  #
  # It runs only after a green suite on main, so a badge can never advertise a number
  # from a run that failed, and never from an unmerged branch.
  badges:
    name: Publish badge data
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the `badges` branch
      actions: read # read this run's coverage artifact
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
      - name: Fetch the coverage profile from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name coverage-profile
      - name: Render the badge data
        run: ./dev/badges
      - name: Publish to the `badges` branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          cd badges
          git init -q -b badges
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "badge data for ${GITHUB_SHA}"
          git push -q --force origin badges

  # A single, stable gate to require in branch protection. Because it depends on
  # the real jobs rather than naming them, the test matrix (OS / Go version) can
  # change freely without ever breaking the required-checks list.
  #
  # On a draft, only the fast tier runs, and this gate reports success once that
  # tier is green. It does not fail merely because the full suite was skipped: a
  # draft cannot be merged (GitHub blocks it at the platform level regardless of
  # checks), so there is nothing for a red gate to guard against, and a required
  # check that is red on every work-in-progress branch is noise, not signal. The
  # gate still fails if a fast-tier job actually failed or was cancelled (see the
  # step below, which runs on every event). Marking the pull request ready fires a
  # fresh run (see the ready_for_review trigger); the gate then also enforces that
  # every full-suite job ran and succeeded, so nothing merges on the fast tier alone.
  ci-success:
    name: CI success
    if: always()
    needs: [setup, test, e2e, lint, vuln, secrets, osv, semgrep, bench, fuzz, pr-body]
    runs-on: ubuntu-latest
    steps:
      - name: Fast tier only (draft)
        if: ${{ needs.setup.outputs.full != 'true' }}
        run: |
          echo "::notice::This is a draft pull request: only the fast tier ran."
          echo "Mark it ready for review to run the full suite."
      - name: Verify required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled."
          exit 1
      # A skipped job is not a passing job. The step above only catches failure and
      # cancellation, so a job that never ran would sail through it. Every job below
      # must have actually succeeded on a run that claims the full suite; pr-body is
      # absent because it is legitimately skipped on a push to main, where there is no
      # pull request body to check.
      - name: Verify no required job was skipped
        if: ${{ needs.setup.outputs.full == 'true' }}
        env:
          RESULTS: >-
            test=${{ needs.test.result }}
            e2e=${{ needs.e2e.result }}
            lint=${{ needs.lint.result }}
            vuln=${{ needs.vuln.result }}
            secrets=${{ needs.secrets.result }}
            osv=${{ needs.osv.result }}
            semgrep=${{ needs.semgrep.result }}
            bench=${{ needs.bench.result }}
            fuzz=${{ needs.fuzz.result }}
        run: |
          failed=0
          for entry in $RESULTS; do
            job=${entry%%=*}
            result=${entry#*=}
            if [ "$result" != "success" ]; then
              echo "::error::Required job '$job' did not succeed (result: $result)."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Every required job ran and succeeded."
      - run: echo "All required CI jobs passed."
