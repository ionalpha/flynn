name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on PR branches (a new push makes the old one moot),
# but never cancel a push to main: every landed commit must get a complete,
# recorded CI result. Cancelling a main run leaves its "CI success" gate
# reporting failure for code that was never actually broken.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Use bash on every OS (including Windows) so command parsing is identical.
# Windows runners default `run:` to PowerShell, which mangles native args like
# `-coverprofile=coverage.out` (go then sees a stray `.out` package).
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floor is Go 1.26: it makes the Green Tea GC the default and adds
        # crypto/hpke to the standard library, and satisfies modernc.org/sqlite.
        go: ["1.26"]
    steps:
      # Actions are pinned to a full commit SHA; Dependabot (.github/dependabot.yml) bumps them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          # Caching is handled by the explicit actions/cache step below. setup-go's
          # own cache keys on the go.sum hash alone with no fallback, so any miss
          # (a dependency bump, an evicted entry, the first run on a branch)
          # recompiles every package cold - twice, once normal and once
          # race-instrumented. The step below adds restore-keys so a miss starts
          # from a near-warm build cache instead.
          cache: false
      # Windows Defender scans every file the Go toolchain writes - a test binary
      # per package plus all compile output - which is the main reason go test is
      # several times slower here than on Linux or macOS. Exclude the workspace
      # and the Go caches from real-time scanning. Windows-only, best-effort (a
      # failure just leaves the job slower, never broken), and it changes nothing
      # about what runs or the -race coverage.
      - name: Exclude Go paths from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$(go env GOCACHE)", "$(go env GOMODCACHE)", "$env:RUNNER_TEMP" -ErrorAction Stop
          } catch {
            Write-Host "Could not set Defender exclusions (continuing): $_"
          }
      # Resolve the module and build cache directories for this OS so the cache
      # step works identically on Linux, macOS, and Windows (their paths differ).
      - id: goenv
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.goenv.outputs.gomodcache }}
            ${{ steps.goenv.outputs.gobuildcache }}
          # The run-specific suffix makes every run save a fresh cache so the
          # build cache never goes stale; the restore-keys fall back to the newest
          # cache for the same go.sum, then to any cache for this OS. Because Go's
          # build cache is content-addressed, a partial restore only recompiles
          # what actually changed - never produces a wrong result.
          key: go-test-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}-
            go-test-${{ runner.os }}-${{ matrix.go }}-
      # go vet compiles every package for this OS, so a build break on this
      # platform fails here; go test then builds and runs the suite under -race.
      # A separate `go build ./...` would only be a third full compile of the tree.
      - run: go vet ./...
      - name: Test (race on every platform; coverage only where it is uploaded)
        # Only ubuntu uploads coverage, so only ubuntu pays the atomic-coverage
        # instrumentation cost. The other platforms run the identical suite under
        # -race with COVER unset, which is a correctness gate, not a coverage one.
        env:
          COVER: ${{ matrix.os == 'ubuntu-latest' && '-covermode=atomic -coverprofile=coverage.out' || '' }}
        run: ./dev/test
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
        continue-on-error: true

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exercise the shipped binary on every release target.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
      - name: Exclude Go paths from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$(go env GOCACHE)", "$(go env GOMODCACHE)", "$env:RUNNER_TEMP" -ErrorAction Stop
          } catch {
            Write-Host "Could not set Defender exclusions (continuing): $_"
          }
      # The e2e suite compiles ./cmd/flynn itself and drives it as a subprocess against a
      # scripted, in-process model server, so it needs no secrets and no network. On a
      # failure it writes the run's stdout, stderr, and a copy of the data dir under
      # FLYNN_E2E_ARTIFACTS for triage.
      - name: E2E
        env:
          FLYNN_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: go test ./e2e/ -count=1
      # To surface the triage bundle in the GitHub UI, add an upload step here pinned to a
      # full commit SHA (Dependabot keeps it current), matching how every other action in
      # this workflow is pinned:
      #   - if: failure()
      #     uses: actions/upload-artifact@<sha> # v4
      #     with:
      #       name: e2e-artifacts-${{ matrix.os }}
      #       path: ${{ runner.temp }}/e2e-artifacts
      #       if-no-files-found: ignore

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          # Caching is handled by the explicit actions/cache step below, which one
          # cache covers all three lint passes (linux, windows, darwin); setup-go's
          # own cache would only key the host target.
          cache: false
      # The non-golangci half of dev/lint: go.mod and go.sum stay tidy.
      - name: go mod tidy leaves go.mod and go.sum unchanged
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # One build cache shared by every lint pass. golangci-lint typechecks the tree
      # for each GOOS it runs against, so the windows and darwin passes below compile
      # a full second and third target; without a warm cache that tripled the job.
      # Cache the module, build, and golangci analysis caches together (Go's build
      # cache is content-addressed, so it holds all three targets' objects side by
      # side and a partial restore only recompiles what changed). The run-specific
      # suffix saves a fresh cache each run so it never goes stale; the restore-keys
      # fall back to the newest cache for this go.sum, then to any lint cache.
      - id: goenv
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.goenv.outputs.gomodcache }}
            ${{ steps.goenv.outputs.gobuildcache }}
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-1.26-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-1.26-${{ hashFiles('**/go.sum') }}-
            go-lint-${{ runner.os }}-1.26-
      # Run golangci-lint from its prebuilt release binary instead of compiling it
      # from source every run. Keep the version in sync with the GOLANGCI_VERSION pin
      # in dev/lint so local and CI results match; it reads the same .golangci.yml, so
      # `golangci-lint run` here is identical to dev/lint's. Its own caching is off:
      # the actions/cache step above is the single authority, so the cross-target
      # objects the platform passes build are saved and restored with everything else.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true
      # The action above lints the host target only (GOOS=linux), so build-tagged
      # platform files (_windows.go, _darwin.go) never reach a maintainer. Re-run the
      # same linter, from the binary the action installed, cross-targeting the other
      # platforms so their files are analyzed on every PR. CGO is disabled so a
      # cgo-only dependency (a pure-Go build tag covers it) does not require a C cross
      # toolchain on the Linux runner.
      - name: Lint platform files (windows, darwin)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows golangci-lint run
          GOOS=darwin golangci-lint run

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
      - run: ./dev/vuln

  # Secret scan: gitleaks over the full commit history, not just the tip, so a
  # secret that was committed and later removed is still caught (it lives on in
  # history, which is what an attacker reads). fetch-depth: 0 pulls every commit.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
      - run: ./dev/secrets

  # Dependency scan via OSV. Complements the govulncheck job: govulncheck is
  # Go/stdlib with reachability analysis (a vulnerability counts only if the
  # vulnerable symbol is reachable), osv-scanner reports the whole dependency set
  # without reachability. The two together are breadth plus reachability, not
  # redundancy.
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
      - run: ./dev/osv

  # Custom Semgrep rules that encode project invariants (see .semgrep) as a
  # machine-checked gate. Complements golangci-lint: golangci runs fixed linters,
  # these rules assert project-specific properties that generic linters cannot,
  # such as a secret's exposed plaintext never flowing into a formatter or logger.
  semgrep:
    name: Semgrep invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # pipx is preinstalled on the runner and puts semgrep on PATH; dev/semgrep
      # then uses that local binary (its Docker fallback is for machines without it).
      - name: Install semgrep
        run: pipx install semgrep==1.167.0
      - run: ./dev/semgrep

  # The performance gate: allocation-ceiling tests and the curated hot-path
  # benchmarks, run without the race detector (the test matrix runs -race, whose
  # instrumentation skews allocation counts, so the ceilings are !race-tagged
  # and only this job exercises them). The short -benchtime keeps it a smoke: it
  # proves the benchmarks run and the ceilings hold, not stable timings.
  bench:
    name: Bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
      - run: BENCHTIME=100x ./dev/bench

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    # Fuzz targets are added by the engineering-rigor work (task 6f520130).
    # Tolerant until then so it never blocks an empty package.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
      - run: go test -run=^$ -fuzz=. -fuzztime=20s ./... || true

  # Enforce the PR template at the gate, not just in dev/pr: this catches PRs
  # opened any other way (gh directly, the web UI, an API call). The body comes
  # from the event payload via env - never interpolated into the script - so a
  # crafted body can't inject shell. Skipped on push (no PR body to check).
  pr-body:
    name: PR body follows template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require template sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=0
          for section in "## What" "## Why" "## How to verify"; do
            case "$BODY" in
              *"$section"*) ;;
              *) echo "::error::PR body is missing the '$section' section."; missing=1 ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            echo "Base the description on .github/PULL_REQUEST_TEMPLATE.md (What / Why / How to verify / Notes)."
            exit 1
          fi
          echo "PR body contains all required template sections."

  # A single, stable gate to require in branch protection. Because it depends on
  # the real jobs rather than naming them, the test matrix (OS / Go version) can
  # change freely without ever breaking the required-checks list.
  ci-success:
    name: CI success
    if: always()
    needs: [test, e2e, lint, vuln, secrets, osv, semgrep, bench, pr-body]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled."
          exit 1
      - run: echo "All required CI jobs passed."
