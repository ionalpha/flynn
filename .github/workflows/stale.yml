name: Stale

on:
  schedule:
    - cron: "30 1 * * *"

# Least privilege at the top level; the stale job widens to exactly what it needs.
permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          # fuzz-crasher is exempt because the nightly files those issues
          # automatically: nobody is obliged to comment on one, so the activity
          # clock would close a live bug report and lose the only durable copy
          # of the input with it.
          exempt-issue-labels: "pinned,security,roadmap,good first issue,fuzz-crasher"
          exempt-pr-labels: "pinned,security,work-in-progress"
          stale-issue-message: >
            This issue has had no activity for 45 days and will be closed in 14 days
            if nothing further happens. Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 45 days and will be closed in 14
            days if nothing further happens. Push or comment to keep it open.
