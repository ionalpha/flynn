name: PR body

# This check validates pull request metadata, not code, which is why it is its own
# workflow rather than a job in ci.yml. The difference that matters is `edited`:
# editing a body has to re-evaluate the check, or a PR failing it can only be fixed
# by pushing a commit that has nothing to do with the problem.
#
# ci.yml cannot take the `edited` trigger. Its concurrency group is keyed on the ref
# with cancel-in-progress, so editing a title would cancel an in-flight matrix run,
# and `ci-success` fails on a cancelled job, so the edit would turn a green pull
# request red. Splitting the check out means a body edit costs one short job.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Keyed on the pull request number, not the ref: an edit produces no new commit, so
# a ref-keyed group would not collapse a burst of edits. Superseding an in-flight run
# is correct here, since the job only reads the body as it currently stands.
concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Enforce the PR template at the gate, not just in dev/pr: this catches PRs opened
  # any other way (gh directly, the web UI, an API call). GitHub does not apply the
  # template to a pull request opened through the API at all, so for those this is the
  # only thing that enforces it. The body comes from the event payload via env, never
  # interpolated into the script, so a crafted body can't inject shell.
  #
  # The job still runs for a bot-authored PR so the check reports a real status rather
  # than a skipped one, but the template requirement is waived: a bot like dependabot
  # writes its own changelog-shaped body we neither control nor want to rewrite, and
  # failing it would only block dependency bumps on a rule meant for humans. The author
  # type comes from the event payload (User or Bot), so this covers every bot without
  # naming one.
  pr-body:
    name: PR body follows template
    runs-on: ubuntu-latest
    steps:
      - name: Require template sections
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "Author is a bot; the template requirement applies to human-authored PRs only."
            exit 0
          fi
          missing=0
          for section in "## What" "## Why" "## How to verify"; do
            case "$BODY" in
              *"$section"*) ;;
              *) echo "::error::PR body is missing the '$section' section."; missing=1 ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            echo "Base the description on .github/PULL_REQUEST_TEMPLATE.md (What / Why / How to verify / Notes)."
            exit 1
          fi
          echo "PR body contains all required template sections."

      # Markdown in a pull request body is not markdown in a file. GitHub renders
      # a single newline inside a paragraph as a line break, so a body wrapped at
      # 72 columns the way a commit message is arrives as a column of ragged short
      # lines. Nothing about the source text looks wrong, which is why review does
      # not catch it: the defect only exists once rendered.
      #
      # The rule is one line per paragraph, and let the browser wrap it. Lists,
      # tables, headings, quotes and fenced code each open their own element, so a
      # newline before one of those is not a line break and none of them are
      # touched. Bots are waived for the reason the step above gives.
      - name: Reject hard-wrapped prose
        if: github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > pr-body.md
          # The body comes from the event payload via env, never interpolated
          # into the script, and awk reads it as data rather than as a program.
          awk '
            # A body composed in the browser arrives CRLF. A bare CR left on the
            # end stops a blank line reading as blank, which would break the
            # paragraph reset and flag the whole body.
            { sub(/\r$/, "") }
            /^[ \t]*(```|~~~)/ { fence = !fence; prev = ""; next }
            fence { next }
            /^[ \t]*$/ { prev = ""; next }
            {
              block = ($0 ~ /^[ \t]*([-*+>|#=]|[0-9]+[.)]|<)/)
              if (prev != "" && !block) {
                printf "::error::PR body line %d continues the line above: \"%s\"\n", NR, substr($0, 1, 60)
                bad++
              }
              prev = block ? "" : $0
            }
            END { exit (bad > 0) }
          ' pr-body.md && {
            echo "PR body has no hard-wrapped paragraphs."
            exit 0
          }
          echo "GitHub renders a newline inside a paragraph as a line break, so the lines above"
          echo "display as separate ragged lines rather than one flowing paragraph. Put each"
          echo "paragraph on a single line. Lists, tables and fenced code are unaffected."
          exit 1
