name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless cosign signing via OIDC
      attestations: write # write SLSA build provenance attestations
      packages: write # push the container image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      # buildx + QEMU so goreleaser can build the linux/arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Registry logins so `goreleaser release` can push the images and their signatures.
      # GHCR authenticates with the built-in workflow token; Docker Hub uses a scoped
      # access token stored in repository secrets (never committed).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign to the 2.x line. cosign 3 makes the new bundle format the
          # default, which ignores the --output-signature/--output-certificate flags
          # the signing step uses to emit the detached checksums.txt.sig and .pem that
          # the install scripts verify. The 2.x line keeps those detached outputs.
          cosign-release: "v2.6.3"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Pin syft so an SBOM tool upgrade cannot change or break the release.
          syft-version: "v1.46.0"
      # The exported-API diff against the previous release, for the release notes
      # (.goreleaser.yaml reads it as APIDIFF_NOTES). The gate itself already ran
      # on main; this is the reporting half, so it must never fail a release:
      # nothing has gone wrong with the build if the diff cannot be computed.
      - name: API compatibility report
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes=""
          prev="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -v -- '-' | grep -vx "$TAG" | head -n 1)"
          if [ -n "$prev" ]; then
            FLYNN_APIDIFF_BASE="$prev" FLYNN_APIDIFF_REPORT=apidiff-notes.md ./dev/apidiff || true
            notes="$(cat apidiff-notes.md 2>/dev/null || true)"
            rm -f apidiff-notes.md
          else
            echo "No earlier release tag; nothing to compare $TAG against."
          fi
          {
            echo "APIDIFF_NOTES<<APIDIFF_NOTES_EOF"
            echo "$notes"
            echo "APIDIFF_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Pin the goreleaser binary to an exact version, not a floating "~> v2",
          # so the release is byte-for-byte reproducible and a new v2.x cannot change
          # its behavior underneath a tag. Bump this deliberately, never automatically.
          version: "v2.17.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attest the distributable archives and native packages GoReleaser
          # produced. This records a signed, verifiable statement that these
          # artifacts were built from this commit by this workflow, checkable
          # with `gh attestation verify`.
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
      - name: Attach provenance to the release
        # attest-build-provenance stores the attestation in GitHub's attestation
        # store, which the OpenSSF Scorecard signed-releases check does not read.
        # It scans release assets by name, so attach the provenance bundle as a
        # *.intoto.jsonl asset for it (and any downstream verifier) to find.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" flynn.intoto.jsonl
          gh release upload "$TAG" flynn.intoto.jsonl --clobber
