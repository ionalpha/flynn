# Service configuration for billing. Owned by the billing team.
[service]
name = billing
port = 8080
# queue_host = old-mq.internal (the host before the 2023 move, kept for reference)
queue_host = mq.internal
queue_port = 5672
# dead letters stay on old-mq.internal until the archive job moves, see README.md
dlq_host = old-mq.internal
retries = 2
