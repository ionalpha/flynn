# Custom Semgrep rules that encode the credential-handling invariant as a
# machine-checked gate, complementing the type-level guarantees in package secret.
#
# secret.Text renders as [REDACTED] under every fmt verb, Stringer, and JSON/text
# encoder, so passing a Text to a logger or formatter is already safe. The one hole
# is Expose(), which returns the raw plaintext for the single audited case where the
# value must cross a boundary the agent does not control (a request header, the
# vault backend). This rule flags an Expose() result used directly inside a
# formatting or logging call, where it would defeat the redaction guarantee. It is
# a syntactic match (not taint) on purpose: taint tracking propagates through the
# error return of decoders and through command execution, so it flags legitimate
# error wrapping. The direct-argument match catches the realistic mistake, a secret
# interpolated straight into a log or format string, without those false positives.
rules:
  - id: secret-expose-not-logged-or-formatted
    languages: [go]
    severity: ERROR
    message: >-
      An Expose() result is being formatted or logged. Expose() is only for handing
      a secret to a boundary the agent does not control (a request header or the
      vault backend); formatting or logging it defeats package secret's redaction
      guarantee. To record that a secret was used, log its reference name, never the
      value. Pass the secret.Text itself (which redacts) instead of Expose().
    patterns:
      - pattern-either:
          - pattern: fmt.Sprint(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Sprintf(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Sprintln(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Print(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Printf(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Println(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Fprint(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Fprintf(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Fprintln(..., <... (...).Expose() ...>, ...)
          - pattern: fmt.Errorf(..., <... (...).Expose() ...>, ...)
          - pattern: log.Print(..., <... (...).Expose() ...>, ...)
          - pattern: log.Printf(..., <... (...).Expose() ...>, ...)
          - pattern: log.Println(..., <... (...).Expose() ...>, ...)
          - pattern: log.Fatal(..., <... (...).Expose() ...>, ...)
          - pattern: log.Fatalf(..., <... (...).Expose() ...>, ...)
          - pattern: log.Fatalln(..., <... (...).Expose() ...>, ...)
          - pattern: log.Panic(..., <... (...).Expose() ...>, ...)
          - pattern: log.Panicf(..., <... (...).Expose() ...>, ...)
          - pattern: log.Panicln(..., <... (...).Expose() ...>, ...)
