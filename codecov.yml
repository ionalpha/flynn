# Codecov configuration. Until now there was none, so Codecov ran on its defaults
# and measured the conformance harnesses as if they were product code.
#
# The `*test` packages below are test code that happens not to live in _test.go
# files: they are the shared contract suites every backend of an interface is run
# against (skilltest, statetest, memorytest and the rest), so they must be
# importable from another package's tests, which _test.go files are not.
#
# Measuring their coverage reports the opposite of what it looks like. A harness is
# mostly assertions, and an assertion's failure branch is reachable only when the
# implementation under test is broken. In a green run every t.Fatal in them is
# uncovered by construction, so a harness sits at roughly 60% no matter how good it
# is, and adding a case to one lowers the patch coverage of the pull request that
# adds it. That penalises writing conformance tests, which is backwards.
#
# `internal/conformtest` is the same kind of code for the same reason, in two halves.
# `conformtest` runs a suite against a deliberately broken implementation in a child
# process and asserts that the suite fails; its Fatalf branches fire only when the suite
# under test cannot fail (the defect it exists to catch), and the child-process half runs
# in a process Codecov never collects from. `conformtest/faultstate` is the broken
# implementation: pass-through store wrappers with a hook per method, whose forwarding
# lines execute only in the tests of the packages that import them. Both are test
# doubles that cannot live in a _test.go file because other packages' tests import them.
#
# The packages they test are not ignored. Coverage of the real implementations,
# which is what the harnesses exist to produce, is unaffected.
#
# The two `*_linux.go` files at the end are ignored for a related reason: their
# number reports the runner's configuration rather than the state of the tests.
# Both attach network plumbing to a child process inside a user namespace, and
# both are covered by tests that call t.Skip when the host has unprivileged user
# namespaces disabled. The GitHub ubuntu runner has them disabled, so the tests
# that exist for this code never execute in CI and it reports 10% and 50% while
# being tested. A pull request that touches either file is then scored against
# coverage it has no way to earn.
ignore:
  - "bus/bustest"
  - "jobs/jobstest"
  - "llm/llmtest"
  - "memory/memorytest"
  - "resource/resourcetest"
  - "skill/skilltest"
  - "spine/spinetest"
  - "state/statetest"
  - "internal/conformtest"
  - "sandbox/egress_linux.go"
  - "sandbox/forward_linux.go"
