# Self-host Flynn with Docker Compose.
#
# Chat channels are outbound (the bot polls its platform), so no inbound port is
# published and the control-plane API stays on loopback. Inspect a running agent with
# `docker compose exec flynn flynn get goals`. See deploy/README.md for remote access.
#
# Copy deploy/.env.example to .env and fill in the secrets, then: `docker compose up -d`.

name: flynn

services:
  flynn:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${FLYNN_VERSION:-0.0.0-dev}
    image: flynn:local
    # Keep a loopback control-plane API and answer Telegram when a token is set. Drop
    # TELEGRAM_BOT_TOKEN to run a monitor-only daemon.
    command:
      - serve
      - --data-dir=/data
      - --api-addr=127.0.0.1:7575
    environment:
      # Model provider key. Required once the agent runs goals (any configured channel).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Chat channel (optional). Remove to run monitor-only.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Control-plane bearer token. If unset, one is generated and printed to the logs.
      FLYNN_API_TOKEN: ${FLYNN_API_TOKEN:-}
    volumes:
      - flynn-data:/data
    restart: unless-stopped
    # Hardening: a read-only root filesystem (all durable state is on the volume), no
    # privilege escalation, every Linux capability dropped, and a small writable /tmp
    # for scratch work. The binary already runs as a non-root user.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  flynn-data:
